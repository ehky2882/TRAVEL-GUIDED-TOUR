# Capture App Store screenshots in simulators.
#
# WHAT THIS DOES (plain English): a Mac in GitHub's cloud opens the app in each
# iPhone and iPad size Apple asks for, walks through it, and photographs each
# screen. The pictures are attached to the run for you to download and look at.
#
# ⚠️ IT DOES NOT UPLOAD ANYTHING TO APPLE. That is on purpose — screenshots are
# the most visible thing on your App Store page, so a human looks at them before
# they go anywhere. When you are happy with them, run the "metadata" job in the
# release workflow, or locally: bundle exec fastlane upload_screenshots
#
# The actual capture steps live in fastlane/Fastfile (the `screenshots` lane)
# and fastlane/Snapfile (which devices, which languages).

name: App Store screenshots

on:
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 90   # two device sizes, each a full app launch + walkthrough
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_DISABLE_COLORS: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v6

      # Ruby version comes from the repo's .ruby-version file — one source of
      # truth for every workflow and for anyone running the lanes locally.
      # Without it setup-ruby fails: "input ruby-version needs to be specified
      # if no .ruby-version or .tool-versions file exists".
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Simulator names change between Xcode versions, and snapshot fails with
      # "Error setting value ... for option 'devices'" if a name in Snapfile is
      # not present on this machine. Print what is actually here, so a failure
      # tells you the answer instead of just the problem.
      - name: List available simulators
        run: |
          echo "## Simulators on this runner" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl list devices available | grep -iE "iphone|ipad" | sed 's/^ *//' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "--- available devices ---"
          xcrun simctl list devices available | grep -iE "iphone|ipad" | sed 's/^ *//'

      # No App Store Connect credentials needed here: capturing screenshots is
      # entirely local to the simulators and never talks to Apple.
      - name: Capture screenshots
        run: bundle exec fastlane screenshots

      # Everything the run produced, for you to download and review.
      - name: Upload screenshots for review
        if: always()   # even a partial set is worth looking at
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: fastlane/screenshots/
          if-no-files-found: warn

      # ⚠️ THIS STEP EXISTS BECAUSE A SHORT SET ONCE SHIPPED AS A SUCCESS.
      # Run 31979282815 produced 3 of 5 screenshots and reported success: the
      # test's own "SCREENSHOT SKIPPED" notes are written with print/NSLog,
      # and fastlane's log formatter swallows both, so nothing surfaced.
      #
      # Checking the produced FILENAMES against the expected set is the one
      # signal that cannot be swallowed. It runs AFTER the upload above (which
      # is `if: always()`), so failing here still leaves every captured image
      # attached to the run for review.
      - name: Verify the expected screenshots
        if: always()
        run: |
          EXPECTED="01-Home-Map 02-Map-Fullscreen 03-Browse-Tours 04-Tour-Detail 05-Walk 06-Library"
          MISSING=""
          {
            echo "## Screenshots"
            echo ""
            echo "| Shot | Status |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in $EXPECTED; do
            if find fastlane/screenshots -name "*${name}.png" 2>/dev/null | grep -q .; then
              echo "| \`${name}\` | ✅ captured |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`${name}\` | ❌ MISSING |" >> "$GITHUB_STEP_SUMMARY"
              MISSING="${MISSING} ${name}"
            fi
          done
          COUNT=$(find fastlane/screenshots -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          {
            echo ""
            echo "Captured **${COUNT}** image(s). Download them from the *Artifacts* section of this run."
            echo ""
            echo "Nothing has been sent to Apple. Review every image before it goes anywhere."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing screenshots:${MISSING}. The UI has probably moved — update TRAVEL GUIDED TOURUITests/ScreenshotUITests.swift. Whatever WAS captured is attached to this run."
            exit 1
          fi
          echo "All ${COUNT} expected screenshots were captured."
