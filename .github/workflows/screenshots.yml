# Capture App Store screenshots in simulators.
#
# WHAT THIS DOES (plain English): a Mac in GitHub's cloud opens the app in each
# iPhone and iPad size Apple asks for, walks through it, and photographs each
# screen. The pictures are attached to the run for you to download and look at.
#
# ⚠️ IT DOES NOT UPLOAD ANYTHING TO APPLE. That is on purpose — screenshots are
# the most visible thing on your App Store page, so a human looks at them before
# they go anywhere. When you are happy with them, run the "metadata" job in the
# release workflow, or locally: bundle exec fastlane upload_screenshots
#
# The actual capture steps live in fastlane/Fastfile (the `screenshots` lane)
# and fastlane/Snapfile (which devices, which languages).

name: App Store screenshots

on:
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 90   # two device sizes, each a full app launch + walkthrough
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_DISABLE_COLORS: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v6

      # Ruby version comes from the repo's .ruby-version file — one source of
      # truth for every workflow and for anyone running the lanes locally.
      # Without it setup-ruby fails: "input ruby-version needs to be specified
      # if no .ruby-version or .tool-versions file exists".
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # No App Store Connect credentials needed here: capturing screenshots is
      # entirely local to the simulators and never talks to Apple.
      - name: Capture screenshots
        run: bundle exec fastlane screenshots

      # Everything the run produced, for you to download and review.
      - name: Upload screenshots for review
        if: always()   # even a partial set is worth looking at
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: fastlane/screenshots/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "## Screenshots" >> "$GITHUB_STEP_SUMMARY"
          COUNT=$(find fastlane/screenshots -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          echo "Captured **${COUNT}** image(s). Download them from the *Artifacts* section of this run." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing has been sent to Apple. Review them first." >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" = "0" ]; then
            echo "::warning::No screenshots were produced. Check the log for 'SCREENSHOT SKIPPED' lines — the UI has probably moved and ScreenshotUITests.swift needs updating."
          fi
