name: Dump catalog functions

# TEMPORARY, read-only diagnostic. Prints the LIVE definitions of the catalog
# RPC functions so `backend/schema.sql` can be brought back in line with what
# is actually running.
#
# It exists because no file in this repo matches the live `get_catalog`: the
# live RPC is a composition (`get_catalog()` = `get_catalog_core()` ||
# `{ places: catalog_places() }`) and schema.sql's copy is stale by three
# shipped features. Reconciling it means reading reality, not diffing the
# migrations against each other — none of them carries the whole thing.
#
# ⚠️ Read-only: `pg_get_functiondef` and a catalogue listing, nothing else.
# No writes, no transaction, no seed. Delete this workflow once schema.sql is
# reconciled — it is a one-off, not a tool.
#
# Manual only. Never runs on push.
on:
  workflow_dispatch:

jobs:
  dump:
    name: Print live catalog function definitions
    runs-on: ubuntu-latest
    steps:
      - name: Check for Supabase credential
        id: guard
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL not set — nothing to dump."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure psql is available
        if: steps.guard.outputs.configured == 'true'
        run: psql --version || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

      - name: Dump
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          \echo '===== CATALOG-RELATED FUNCTIONS IN public ====='
          select p.proname || '  (' || pg_get_function_identity_arguments(p.oid) || ')'
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'public'
             and (p.proname like '%catalog%' or p.proname like '%places%')
           order by p.proname;

          \echo ''
          \echo '===== BEGIN get_catalog ====='
          select pg_get_functiondef(p.oid)
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'public' and p.proname = 'get_catalog';
          \echo '===== END get_catalog ====='

          \echo ''
          \echo '===== BEGIN get_catalog_core ====='
          select pg_get_functiondef(p.oid)
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'public' and p.proname = 'get_catalog_core';
          \echo '===== END get_catalog_core ====='

          \echo ''
          \echo '===== BEGIN catalog_places ====='
          select pg_get_functiondef(p.oid)
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'public' and p.proname = 'catalog_places';
          \echo '===== END catalog_places ====='

          \echo ''
          \echo '===== tours + makers + places COLUMNS ====='
          select table_name || '.' || column_name || ' :: ' || data_type
            from information_schema.columns
           where table_schema = 'public'
             and table_name in ('tours','makers','places')
           order by table_name, ordinal_position;
          SQL
