# Build a signed app and send it to TestFlight, on demand.
#
# WHAT THIS DOES (plain English): when you ask for it, a Mac in GitHub's cloud
# builds your app, signs it so a real iPhone will trust it, and uploads it to
# TestFlight — so a testable version just shows up on your phone. No Mac needed
# from you.
#
# HOW YOU TRIGGER IT (two ways):
#   1. Add the label "build" to any pull request, OR
#   2. Actions tab -> "TestFlight build" -> "Run workflow".
# It does NOT run on every push (Mac build minutes are ~10x the cost), only when
# you ask.
#
# ⚠️ A build uses the workflow file from the branch you build FROM, not from
# main. So a fix merged to main has no effect on a build cut from a feature
# branch until that branch merges main in. Build from main, or merge main first.
#
# THE ACTUAL BUILD STEPS LIVE IN fastlane/Fastfile (the `beta` lane), not here.
# This file only decides WHEN to build and hands over the credentials. That way
# the identical build can be run from a Mac with:
#     bundle exec fastlane beta
#
# ONE-TIME SETUP (owner, in GitHub -> Settings -> Secrets and variables ->
# Actions). These come from an App Store Connect API key (see docs/fastlane.md):
#   APP_STORE_CONNECT_KEY_ID       - the key's ID (e.g. ABC123XYZ9)
#   APP_STORE_CONNECT_ISSUER_ID    - the issuer ID (a long uuid)
#   APP_STORE_CONNECT_API_KEY      - the contents of the downloaded AuthKey_XXXX.p8
# Until those exist the workflow just fails fast with a clear message — harmless.

name: TestFlight build

on:
  workflow_dispatch:            # the manual "Run workflow" button
    inputs:
      notes:
        description: "Build notes — What changed + What to test (required; never ship a mystery build)"
        required: false
        type: string
  pull_request:
    types: [labeled]            # runs only when a label is added (guarded below)

# If you trigger twice, cancel the older run — no wasted Mac minutes.
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    # Only proceed for a manual run, or when the label added is exactly "build".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'build'
    runs-on: macos-26           # a Mac in the cloud (your other CI already uses this)
    timeout-minutes: 70         # build ~15 min + waiting for Apple to process the
                                # upload so the notes can be attached
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_DISABLE_COLORS: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v6

      # Resolve the build notes (What changed / What to test) that describe this
      # build. They go into the run's job summary here, and — after the upload —
      # into TestFlight's "What to Test" field, so the description shows up right
      # under the build in the TestFlight app on your phone. Never a mystery build.
      # Fallback order: the Run-workflow notes box -> the PR title + body (label
      # trigger) -> the commit subject.
      - name: Resolve + record build notes
        id: notes
        env:
          NOTES: ${{ github.event.inputs.notes }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$NOTES" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            NOTES="PR #${PR_NUMBER}: ${PR_TITLE}"$'\n\n'"${PR_BODY}"
          fi
          if [ -z "$NOTES" ]; then
            echo "::warning::No build notes were provided. Per CLAUDE.md rule #9, every build should carry What-changed / What-to-test notes. Falling back to the commit subject."
            NOTES="Built from commit: $(git log -1 --pretty=%s)"
          fi
          # TestFlight's What-to-Test field caps at 4000 characters.
          NOTES="${NOTES:0:4000}"
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Build notes"
            echo "$NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail early with a friendly message if the one-time secrets aren't set yet.
      - name: Check credentials are configured
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "::error::App Store Connect secrets are not set. Add APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, and APP_STORE_CONNECT_API_KEY under Settings -> Secrets and variables -> Actions. See docs/fastlane.md."
            exit 1
          fi

      # Install the exact fastlane pinned in the Gemfile, with the gems cached
      # between runs so this is seconds rather than minutes.
      # Ruby version comes from the repo's .ruby-version file — one source of
      # truth for every workflow and for anyone running the lanes locally.
      # Without it setup-ruby fails: "input ruby-version needs to be specified
      # if no .ruby-version or .tool-versions file exists".
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Used by scripts/revoke-dev-certs.py to talk to Apple's API.
      - name: Install certificate-cleanup dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check "PyJWT>=2" cryptography \
            || python3 -m pip install --quiet --break-system-packages "PyJWT>=2" cryptography

      # Everything that actually builds, signs, uploads, and attaches the notes
      # lives in the `beta` lane. Build number = this run's counter, which always
      # increases — exactly what TestFlight requires.
      - name: Build and upload to TestFlight
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_NOTES: ${{ steps.notes.outputs.notes }}
        run: bundle exec fastlane beta

      - name: Done
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          echo "Uploaded build ${{ github.run_number }} to TestFlight, with these notes attached under \"What to Test\":"
          echo "$NOTES"
