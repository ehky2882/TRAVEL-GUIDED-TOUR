# Build a signed app and send it to TestFlight, on demand.
#
# WHAT THIS DOES (plain English): when you ask for it, a Mac in GitHub's cloud
# builds your app, signs it so a real iPhone will trust it, and uploads it to
# TestFlight — so a testable version just shows up on your phone. No Mac needed
# from you.
#
# HOW YOU TRIGGER IT (two ways):
#   1. Add the label "build" to any pull request, OR
#   2. Actions tab -> "TestFlight build" -> "Run workflow".
# It does NOT run on every push (Mac build minutes are ~10x the cost), only when
# you ask.
#
# ONE-TIME SETUP (owner, in GitHub -> Settings -> Secrets and variables ->
# Actions). These come from an App Store Connect API key (see docs/testflight-ci.md):
#   APP_STORE_CONNECT_KEY_ID       - the key's ID (e.g. ABC123XYZ9)
#   APP_STORE_CONNECT_ISSUER_ID    - the issuer ID (a long uuid)
#   APP_STORE_CONNECT_API_KEY      - the contents of the downloaded AuthKey_XXXX.p8
# Until those exist the workflow just fails fast with a clear message — harmless.

name: TestFlight build

on:
  workflow_dispatch:            # the manual "Run workflow" button
    inputs:
      notes:
        description: "Build notes — What changed + What to test (required; never ship a mystery build)"
        required: false
        type: string
  pull_request:
    types: [labeled]            # runs only when a label is added (guarded below)

# If you trigger twice, cancel the older run — no wasted Mac minutes.
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    # Only proceed for a manual run, or when the label added is exactly "build".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'build'
    runs-on: macos-26           # a Mac in the cloud (your other CI already uses this)
    timeout-minutes: 40
    env:
      SCHEME: "TRAVEL GUIDED TOUR"
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6

      # Record the build notes (What changed / What to test) into the run's job
      # summary so every build is self-documenting — never a mystery build.
      # For a PR-label trigger there's no notes input; point at the PR instead.
      - name: Record build notes
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          {
            echo "## Build notes"
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            elif [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_Triggered by the \`build\` label on PR #${{ github.event.pull_request.number }} — see the PR for what changed + what to test._"
            else
              echo "::warning::No build notes were provided. Per CLAUDE.md rule #9, every build should carry What-changed / What-to-test notes."
              echo "_No notes provided._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail early with a friendly message if the one-time secrets aren't set yet.
      - name: Check credentials are configured
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ]; then
            echo "::error::App Store Connect secrets are not set. Add APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, and APP_STORE_CONNECT_API_KEY under Settings -> Secrets and variables -> Actions. See docs/testflight-ci.md."
            exit 1
          fi

      # Write Apple's API key (the "pass") to a file the build tools can read.
      - name: Install App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      # Keep the account under Apple's certificate cap automatically — the
      # durable fix for the recurring "Your account has reached the maximum
      # number of certificates" archive failure. Cloud signing mints a fresh
      # "Apple Development" certificate on each throwaway build machine, so
      # without cleanup they accumulate until archiving dies. Using the same App
      # Store Connect API key, we revoke existing DEVELOPMENT certs before the
      # archive; automatic signing then regenerates exactly the one it needs, so
      # the account never fills up and no manual revoking is ever required.
      # DISTRIBUTION certs (used to sign the App Store upload) are left untouched.
      # Best-effort (continue-on-error): an API hiccup here must never block a build.
      - name: Free up Apple Development certificate slots
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --disable-pip-version-check "PyJWT>=2" cryptography \
            || python3 -m pip install --quiet --break-system-packages "PyJWT>=2" cryptography
          python3 - <<'PY'
          import glob, json, os, time, urllib.request, urllib.error
          import jwt  # PyJWT

          key_id = os.environ["KEY_ID"]
          issuer = os.environ["ISSUER_ID"]
          p8 = open(glob.glob(os.path.expanduser("~/private_keys/AuthKey_*.p8"))[0]).read()
          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              p8, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"},
          )
          base = "https://api.appstoreconnect.apple.com/v1/certificates"

          def api(url, method="GET"):
              req = urllib.request.Request(
                  url, method=method, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req) as r:
                      raw = r.read()
                      return r.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  return e.code, {}

          status, body = api(f"{base}?filter[certificateType]=DEVELOPMENT&limit=200")
          certs = body.get("data", []) if status == 200 else []
          print(f"List DEVELOPMENT certs: HTTP {status}, {len(certs)} found")
          for c in certs:
              cid = c["id"]
              s, _ = api(f"{base}/{cid}", method="DELETE")
              print(f"  revoke {cid}: HTTP {s}")
          print("Done freeing certificate slots.")
          PY

      # Clean, always-increasing build number: the workflow's own run counter.
      # TestFlight requires each upload's number to be higher than the last within
      # a given marketing version; run_number is monotonic, so it satisfies that.
      # (Marketing version is 1.1 in the project — the 1.0 timestamp builds live in
      # a separate version train, so starting fresh here is clean.)
      - name: Compute a clean build number
        id: bn
        run: echo "num=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Build + sign the app into an ".xcarchive" (Apple's packaged, signed app).
      # -allowProvisioningUpdates + the API key let Xcode create/download the
      # signing certificates automatically — the same automatic signing your
      # manual Organizer archives already use. The "Free up ... certificate
      # slots" step above keeps this from ever hitting Apple's cert cap.
      - name: Archive (build + sign)
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Dozent.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.bn.outputs.num }}

      # Export the archive as an ".ipa" and upload it straight to TestFlight.
      - name: Export + upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Dozent.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Done
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          echo "Uploaded build ${{ steps.bn.outputs.num }} to TestFlight. It appears on your phone once Apple finishes processing (a few minutes)."
          echo "Build 1.1 (${{ steps.bn.outputs.num }}) — notes:"
          echo "${NOTES:-<none provided>}"
