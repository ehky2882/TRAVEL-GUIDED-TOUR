name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual run, on any branch. Needed because a web/remote session's pushes
  # don't always produce a `synchronize` event on an open PR, which leaves
  # later commits unverified — and CI is the only build + test check a Linux
  # session has (no Mac in-session, so no `test_sim`).
  workflow_dispatch:

jobs:
  validate-content:
    name: Validate Tours.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - name: Run Tours.json validator
        run: swift scripts/validate-tours.swift

  # Place candidates, surfaced on the PR that creates them.
  #
  # 🔴 WHY THIS EXISTS. Rule 8c told sessions to run check-place-candidates.py
  # after a batch, and it was a manual step nobody had time for: the backlog
  # was cleared to zero at 02:25 on 2026-09-16 and by 14:00 — after 286 pins
  # across FOUR batches from several sessions and a second contributor — it was
  # back to 17 NAME and 18 EXACT. The owner was finding these on the map.
  #
  # ⚠️ It REPORTS, it does not fail. Content PRs auto-merge under CLAUDE.md
  # rule 4, and minting a place needs an anchor decision only the owner can
  # make — failing here would stall somebody else's pin batch on a judgement
  # call. It fails ONLY if the checker could not run, which is this repo's own
  # "a check that cannot run must not return a pass".
  place-candidates:
    name: Place candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan for place candidates
        run: |
          # ⚠️ GitHub runs `run:` under `bash -e`, so a bare non-zero exit would
          # kill the step before the code could be read — and exit 1 here means
          # "candidates found", which is NOT a failure. `|| code=$?` is what
          # keeps this job reporting rather than blocking.
          code=0
          python3 scripts/check-place-candidates.py --out candidates.txt || code=$?
          # 0 = nothing found, 1 = candidates found (both fine), >=2 = the
          # check itself failed. Read DIRECTLY, never through a pipe.
          if [ "$code" -ge 2 ]; then
            echo "::error::check-place-candidates.py could not run (exit $code)"
            cat candidates.txt || true
            exit "$code"
          fi
          {
            echo "## Place candidates"
            echo
            echo '```'
            sed -n '/^NAME —/,/^TIGHT —/p' candidates.txt | sed '$d'
            echo '```'
            tail -2 candidates.txt
          } >> "$GITHUB_STEP_SUMMARY"
          n=$(tail -2 candidates.txt | grep -oE '^[0-9]+ name' | grep -oE '^[0-9]+' || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::warning::$n unplaced pair(s) share a name — docs/places.md Rule 1 says every one is a place. See the job summary."
          fi

      # The INVERSE question, in the same job because it shares the catalogue
      # and costs nothing: check-place-candidates asks which entries are close
      # enough to be one place; this asks why two entries we call by the SAME
      # NAME sit in different places. Agreement is the norm — 158 of 164 groups
      # within 100 m — so a disagreement is a real question about one in six.
      - name: Scan for same-name entries in different places
        run: |
          # Same exit contract as above: 1 means "findings to read", which is
          # not a failure. Read the code DIRECTLY, never through a pipe.
          code=0
          python3 scripts/check-same-name.py --out same-name.txt || code=$?
          if [ "$code" -ge 2 ]; then
            echo "::error::check-same-name.py could not run (exit $code)"
            cat same-name.txt || true
            exit "$code"
          fi
          {
            echo "## Same name, different place"
            echo
            echo '```'
            sed -n '/name(s) used by/,$p' same-name.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          n=$(grep -oE '^[0-9]+ name\(s\) to read' same-name.txt | grep -oE '^[0-9]+' || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::warning::$n repeated name(s) sit in more than one place. NOT a verdict — an extended site and a chain with two branches both span legitimately; what matters is a group where most members agree and one does not."
          fi

      # 🔴 The only check in this job that asks NO external source, which is the
      # point. The two above and the spine audit are all lookups, so they are
      # silent on the 2,901 entries Wikidata does not know — and that blind spot
      # is not random: many of those titles are not names at all ("The Million
      # Dollar Corner", "A Greek Goddess on Fifth Avenue"), so no amount of extra
      # sources will ever reach them. This one asks the catalogue about itself,
      # and it is how "Great Court, British Museum" was found sitting 58 km away
      # in a business park in GREAT NOTLEY, Essex — the entry was UNMATCHED, so
      # every lookup here had nothing to say about it.
      # ⚠️ This one is selftested before it is believed, where the two above are
      # not, and the reason is specific: they compare a coordinate to something
      # external, so a broken guard shows up as a wrong number. This one derives
      # its centre, its scale and its threshold from the catalogue itself, and
      # every way of breaking those produces NO finding rather than a wrong one.
      # An outlier check that silently flags nothing reads exactly like a clean
      # catalogue.
      # 🔴 Did a batch arrive with its captions still cut at 140?
      # make-link-pin.py stopped truncating on 2026-09-21, and on 2026-09-22
      # EIGHTY-SEVEN fresh captions arrived cut anyway: #1054 was built from a
      # branch taken before the fix, so the batch carried the old code with it.
      # A pipeline fix does not reach work already in flight, and nothing
      # noticed until a count was re-derived by hand. This fails the step so
      # the next one is caught instead of discovered.
      - name: Selftest the truncation guard before believing it
        run: python3 scripts/refetch-captions.py --selftest
      - name: Prove every guard in it can still fail
        run: python3 scripts/mutate-refetch-captions.py
      - name: No caption may arrive newly cut at 140 characters
        run: |
          # ⚠️ Exit 1 here means NEW truncation and IS a failure — unlike the
          # reporting checks around it. Known-dead posts are excused by the
          # cache, so a red step means some checkout is still cutting.
          code=0
          python3 scripts/refetch-captions.py --check --out captions-cut.txt || code=$?
          cat captions-cut.txt
          if [ "$code" -ne 0 ]; then
            echo "::error::captions arrived cut at 140 — rebase the branch onto a main that has make-link-pin.py's fix, then re-run the refetch"
            exit 1
          fi

      # 🔴 The creator's own location line, checked against the pin's city.
      # Only worth running since the caption recovery: before it, 13 captions
      # carried a usable location and the check was too noisy to automate; now
      # 914 do. Selftested and mutation-tested first, for the same reason as
      # the outlier check below — every way of breaking it produces silence.
      - name: Selftest the caption-locality check before believing it
        run: python3 scripts/check-caption-address.py --selftest
      - name: Prove every guard in it can still fail
        run: python3 scripts/mutate-check-caption-address.py
      - name: Scan for captions naming a different city
        run: |
          # 1 means "findings to read", not a failure — most of what it finds
          # is an adjacent town or a street that shares a city's name.
          code=0
          python3 scripts/check-caption-address.py --out caption-city.txt || code=$?
          if [ "$code" -ge 2 ]; then
            echo "::error::check-caption-address.py could not run (exit $code)"
            cat caption-city.txt || true
            exit "$code"
          fi
          {
            echo "## Caption names a different city"
            echo
            echo '```'
            sed -n '/captions carry a location marker/,$p' caption-city.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Selftest the outlier check before believing a number it prints
        run: python3 scripts/check-city-outliers.py --selftest
      - name: Prove every guard in it can still fail
        run: python3 scripts/mutate-check-city-outliers.py
      - name: Scan for entries far from their own city
        run: |
          # Same exit contract: 1 means "findings to read", not a failure. This
          # one especially — most of what it flags is CORRECT (Cape Point is
          # 48 km from Cape Town), so it must never gate a merge.
          code=0
          python3 scripts/check-city-outliers.py --out city-outliers.txt || code=$?
          if [ "$code" -ge 2 ]; then
            echo "::error::check-city-outliers.py could not run (exit $code)"
            cat city-outliers.txt || true
            exit "$code"
          fi
          {
            echo "## Far from its own city"
            echo
            echo '```'
            sed -n '/entries scored against/,$p' city-outliers.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit-board:
    name: Audit board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # 🔴 This job exists because a class with NO check is invisible. The board
      # prints every defect class, covered or not, so an uncovered one shows up
      # on every PR instead of waiting for the owner to notice it on a map.
      - name: Selftest the board before believing a number it prints
        run: python3 scripts/audit-board.py --selftest
      - name: Prove every guard can still fail
        run: python3 scripts/mutate-audit-board.py
      - name: Print the board
        run: |
          # ⚠️ `bash -e` again: the board exits 0 today, but a check that cannot
          # run must be able to say so without the step dying first.
          code=0
          python3 scripts/audit-board.py --out board.txt || code=$?
          if [ "$code" -ge 2 ]; then
            echo "::error::audit-board.py could not run (exit $code)"
            cat board.txt || true
            exit "$code"
          fi
          {
            echo "## Audit board"
            echo
            echo '```'
            cat board.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # An ERR row means a check broke, which a count of 0 would hide.
          if grep -q "ERR:" board.txt; then
            echo "::error::a check on the audit board could not run — see the summary"
            exit 2
          fi

  # The spine audit asks a question no other check here asks: not "is this
  # coordinate plausible?" but "is it where the thing this entry is NAMED AFTER
  # actually stands?" Offline — it reads a committed cache, never the network.
  spine-match:
    name: Spine coordinate audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Band every entry against Wikidata
        run: |
          # ⚠️ GitHub runs `run:` under `bash -e`, so a bare non-zero exit would
          # kill the step before the code could be read — and exit 1 here means
          # "findings to review", which is NOT a failure. `|| code=$?` is what
          # keeps this job reporting rather than blocking.
          code=0
          python3 scripts/spine-match.py --out spine-audit.txt || code=$?
          # 0 = nothing disagrees, 1 = findings (both fine), >=2 = the check
          # could not run — a missing or incomplete cache. Read the code
          # DIRECTLY, never through a pipe.
          if [ "$code" -ge 2 ]; then
            echo "::error::spine-match.py could not run (exit $code) — the lookup cache is missing or incomplete; run scripts/spine-lookup.py"
            cat spine-audit.txt || true
            exit "$code"
          fi
          {
            echo "## Spine coordinate audit"
            echo
            echo '```'
            sed -n '/^🔴 DISAGREES/,/^CONFIRMS:/p' spine-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          n=$(grep -oE '^🔴 DISAGREES[^:]*: [0-9]+' spine-audit.txt | grep -oE '[0-9]+$' || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::warning::$n entr(y/ies) sit somewhere other than where Wikidata says their subject is. A LARGE SITE (a park, a cemetery, a whole town) reads this way and is usually not an error — read the subject before the number."
          fi

  # In-app account deletion: the SQL runs against a throwaway Postgres (the
  # Ubuntu runner ships one) and the Edge Function is type-checked, because
  # both reach production by the owner pasting them into Supabase — the worst
  # place to find a mistake. See backend/test-account-deletion.sh.
  account-deletion:
    name: Account deletion (SQL + Edge Function)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run account_deletion.sql against Postgres
        run: bash backend/test-account-deletion.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the delete-account Edge Function
        run: deno check backend/functions/delete-account/index.ts

  build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Show Xcode
        run: |
          # Use the macos-26 runner's DEFAULT Xcode. It is an Xcode 26
          # release (iOS 26 SDK) — enough to compile this project, which
          # targets iOS 26.2 — and GitHub ships it with a matching iOS
          # simulator runtime pre-installed. Do NOT xcode-select a newer
          # Xcode: the newest one on the image can carry an SDK ahead of
          # every installed simulator runtime, which breaks the test job
          # ("No simulator runtime version ... available to use with
          # iphonesimulator SDK version ...").
          xcodebuild -version
          xcrun simctl list runtimes | head -20
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "TRAVEL GUIDED TOUR" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Run unit tests
    runs-on: macos-26
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Show Xcode
        run: |
          # Default Xcode only — see the build job's note. Selecting a
          # newer Xcode here picks an SDK with no matching simulator
          # runtime, and the test build fails.
          xcodebuild -version
      - name: Detect test scheme
        id: check
        run: |
          if xcodebuild -list -project "TRAVEL GUIDED TOUR.xcodeproj" 2>/dev/null \
              | grep -q "TRAVEL GUIDED TOURTests"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Test target not yet wired into the Xcode project."
            echo "::notice::See TRAVEL GUIDED TOURTests/README.md for setup steps."
          fi
      - name: Prepare iOS simulator
        if: steps.check.outputs.has_tests == 'true'
        id: sim
        run: |
          # GitHub Actions runner-pool variance: some runners come with
          # pre-created iPhone simulators ready to use, others have only
          # Xcode + runtimes installed and no concrete devices. On the
          # latter, `xcodebuild test -destination "name=iPhone NN"` fails
          # with "Unable to find a device matching the provided
          # destination specifier" after a ~60s timeout. Fix: explicitly
          # create + boot a simulator at job start so we control the state.
          # See docs/troubleshooting.md § "CI test job: no concrete iOS
          # Simulator on runner."
          set -e

          # Pick the latest available iOS runtime
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rts = json.load(sys.stdin)["runtimes"]
          ios = [r for r in rts if r["platform"] == "iOS" and r["isAvailable"]]
          if not ios:
              sys.exit("No available iOS runtimes")
          latest = sorted(ios, key=lambda r: tuple(int(x) for x in r["version"].split(".")))[-1]
          print(latest["identifier"])
          ')
          echo "iOS runtime: $RUNTIME"

          # Pick the first iPhone device type that's still supported on
          # this runtime (model availability varies by Xcode version)
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          dts = json.load(sys.stdin)["devicetypes"]
          # Prefer a recent non-Pro iPhone, then fall back to any iPhone
          preferred = ["iPhone 17", "iPhone 16", "iPhone 18", "iPhone 17 Pro", "iPhone 16 Pro"]
          by_name = {d["name"]: d["identifier"] for d in dts}
          for name in preferred:
              if name in by_name:
                  print(by_name[name]); sys.exit(0)
          # Fallback: any iPhone
          for d in dts:
              if "iPhone" in d["name"]:
                  print(d["identifier"]); sys.exit(0)
          sys.exit("No iPhone device types found")
          ')
          echo "Device type: $DEVICE_TYPE"

          # Create the simulator
          UDID=$(xcrun simctl create "ci-test-device" "$DEVICE_TYPE" "$RUNTIME")
          echo "Created simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          # Boot it (xcodebuild would boot it anyway, but doing so explicitly
          # avoids a race where the first test run times out on cold boot)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Run tests
        if: steps.check.outputs.has_tests == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "TRAVEL GUIDED TOUR" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
