name: Publish catalog

# Keeps the remote tour catalog in lockstep with the repo.
#
# The app fetches its catalog from the gh-pages copy of Tours.json at launch,
# with the bundled file as offline fallback. Source of truth is the bundled
# file on main: TRAVEL GUIDED TOUR/Resources/Tours.json. This workflow copies
# that one file to the gh-pages branch root whenever it changes, so the two
# can never silently drift (as they did 272-vs-300 during PR #209 testing).
#
# It only ever touches Tours.json on gh-pages — audio/, images/, privacy/,
# index.html etc. are uploaded by content sessions and are left untouched.
#
# ⚠️ THE `rebuild-related` JOB BELOW DOES PUSH TO MAIN, which this comment used
# to promise never happened. It is what stops "More like this" going stale: a
# new tour has no neighbours until the suggestions are regenerated, and that
# was a manual step nobody was going to remember after a city launch. The loop
# it could cause is closed by `[skip ci]` in its commit message, which stops
# GitHub raising a new run for it; the publish and seed jobs below then read
# the commit it just made, in this same run.
#
# Second destination (since the V2 Supabase cutover, PR #255): the app now
# reads its catalog from the Supabase `get_catalog` RPC FIRST, with gh-pages
# as the fallback mirror. So the same Tours.json change must also be upserted
# into the Supabase DB, or the gh-pages fallback could drift NEWER than the
# live source. The `seed-supabase` job below does that via the existing
# idempotent seed script. It is OPT-IN: it no-ops unless the repo secret
# SUPABASE_DB_URL is set, so the gh-pages publish above is never affected.

on:
  push:
    branches: [main]
    paths:
      - "TRAVEL GUIDED TOUR/Resources/Tours.json"
  workflow_dispatch: # allow a manual force-resync from the Actions tab

permissions:
  contents: write # push to gh-pages, and the regenerated catalog to main

# Two content merges in quick succession would otherwise both regenerate and
# both try to push to main. Serialized, never cancelled: a cancelled run leaves
# the mirror stale, which is the failure this workflow exists to prevent.
concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  # Regenerate the "More like this" neighbour lists before anything is
  # published, so a newly added tour ships WITH its suggestions rather than
  # waiting for someone to remember the command.
  #
  # 🔴 THE VECTORS ARE DELIBERATELY NOT CACHED, and that is not an oversight.
  # Caching them means reusing a saved answer whenever an entry "looks
  # unchanged", and the day that check is wrong — a field added to the text, a
  # hash that misses an edit — the affected tours keep a stale neighbour list
  # silently, with no error and no red build. Recomputing costs ~15 minutes of
  # free runner time and cannot be wrong. Only the MODEL download is cached,
  # because that is the slow, flaky, network-dependent part and its contents
  # are pinned by name.
  rebuild-related:
    name: Rebuild "More like this" suggestions
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.regenerate.outputs.changed }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-embeddings.txt

      # Is a rebuild owed at all? Needs no model and no network, and answers in
      # under a second. MOST CONTENT MERGES CHANGE NO EMBEDDED TEXT — #930 moved
      # 34 entries' coordinates across 170 changed lines and the digest did not
      # move a single bit, because `tour_text` reads titles, descriptions, tags,
      # city, country and stop captions, and never a coordinate or an image URL.
      # Without this check every such merge would delay the mirror and the
      # Supabase seed by ~15 minutes to produce an empty diff.
      - name: Is a rebuild owed?
        id: owed
        run: |
          set -euo pipefail
          CURRENT=$(python3 scripts/build-embeddings.py --text-digest)
          RECORDED=$(cat scripts/related-text.digest 2>/dev/null || echo "")
          echo "current:  $CURRENT"
          echo "recorded: $RECORDED"
          if [ "$CURRENT" = "$RECORDED" ]; then
            echo "No embedded text changed — skipping the rebuild."
            echo "owed=false" >> "$GITHUB_OUTPUT"
          else
            echo "owed=true" >> "$GITHUB_OUTPUT"
          fi

      # Keyed by the model id the script pins, so a model change misses the
      # cache and refetches rather than silently running the old weights.
      - name: Cache the embedding model
        if: steps.owed.outputs.owed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/atlas-embed
          key: atlas-embed-all-MiniLM-L6-v2-v1

      - name: Install dependencies
        if: steps.owed.outputs.owed == 'true'
        run: pip install -r scripts/requirements-embeddings.txt

      # Model-free and fast. If the generator itself is broken, fail here
      # rather than after writing 15,000 lines into the catalog.
      - name: Generator self-tests
        run: python3 scripts/build-embeddings.py --selftest

      - name: Regenerate neighbour lists
        if: steps.owed.outputs.owed == 'true'
        id: regenerate
        run: |
          set -euo pipefail
          python3 scripts/build-embeddings.py --write-related
          # ⚠️ BOTH paths, and the digest is the one that matters. A rebuild can
          # legitimately leave the catalog untouched — a new tour whose matches
          # all fall under the floor and which displaces nobody — while the
          # digest HAS moved, because its text is new. Checking only the catalog
          # would skip the commit, leave the digest unadvanced, and make every
          # future merge re-run the 15-minute rebuild forever, finding nothing.
          if git diff --quiet -- "TRAVEL GUIDED TOUR/Resources/Tours.json" scripts/related-text.digest; then
            echo "Neither the catalog nor the digest moved — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The catalog is about to be pushed to main unreviewed, so it gets the
      # same gate a human would have run. The mirror is the Python stand-in for
      # validate-tours.swift (no Swift on this runner); it self-tests against
      # injected faults before its verdict counts, and it enforces the rule
      # nothing else can see — a link pin's neighbours must all share its city.
      - name: Validate the regenerated catalog
        if: steps.regenerate.outputs.changed == 'true'
        run: python3 scripts/validate-tours-mirror.py

      - name: Commit the regenerated catalog to main
        if: steps.regenerate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The digest goes in the SAME commit as the catalog it describes. If
          # they ever disagree, either a rebuild is suppressed that was owed, or
          # one is forced that was not.
          git add "TRAVEL GUIDED TOUR/Resources/Tours.json" scripts/related-text.digest
          # [skip ci] is load-bearing: without it this push retriggers this very
          # workflow, which regenerates, finds nothing to change, and stops —
          # but only after burning another 15 minutes on every content merge.
          git commit -m "chore(catalog): rebuild More like this suggestions [skip ci]"

          if git push origin HEAD:main; then
            echo "Pushed the regenerated catalog to main."
            exit 0
          fi

          # main moved while we were embedding. Do NOT fight it: the publish and
          # seed jobs below still ship whatever main holds, so content reaches
          # phones either way, and the next content merge regenerates from
          # scratch. Loud, visible, and self-healing beats a forced push.
          echo "::warning::main moved during the rebuild — suggestions not updated this run. The next content merge will regenerate them."

  publish:
    name: Publish Tours.json to gh-pages
    runs-on: ubuntu-latest
    # Waits for the rebuild so the mirror carries the regenerated suggestions,
    # but is NOT gated on it succeeding: if embedding fails, content must still
    # reach phones. `!cancelled()` rather than `always()` so a cancelled run
    # does not push a half-finished catalog.
    needs: rebuild-related
    if: ${{ !cancelled() }}
    steps:
      # main — the source of truth. We only need the one file, so sparse-checkout it.
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
          sparse-checkout: |
            TRAVEL GUIDED TOUR/Resources/Tours.json
          sparse-checkout-cone-mode: false

      # Validation gate: never publish a corrupt or empty catalog.
      # We can't run the Swift validator on a generic runner, but a JSON parse
      # plus a non-empty tours/makers sanity check catches the failure modes
      # that would actually break the app (malformed JSON, truncated file).
      - name: Validate Tours.json
        run: |
          python3 - <<'PY'
          import json, sys
          path = "main/TRAVEL GUIDED TOUR/Resources/Tours.json"
          with open(path) as f:
              data = json.load(f)  # raises -> job fails on malformed JSON
          tours = data.get("tours")
          makers = data.get("makers")
          if not isinstance(tours, list) or not tours:
              sys.exit("Validation failed: 'tours' is missing or empty")
          if not isinstance(makers, list) or not makers:
              sys.exit("Validation failed: 'makers' is missing or empty")

          # 🔴 The mirror is the FALLBACK the app reads when Supabase is
          # unreachable, so it is exactly the copy an old build ends up on in
          # the worst moment. A `kind: "link"` tour inside `tours` fails the
          # whole catalog decode on every build predating `TourKind.link` — one
          # bad element, `try?` swallows it, the phone silently stops receiving
          # content. That is not a shape the mirror may ever carry, so refuse to
          # publish it rather than discovering it on a phone.
          stray = [t.get("id") for t in tours if t.get("kind") == "link"]
          if stray:
              sys.exit(
                  f"Validation failed: {len(stray)} link pin(s) are inside 'tours' "
                  f"(first: {stray[0]}). They belong in the top-level 'linkPins' array."
              )
          pins = data.get("linkPins") or []
          print(f"OK: {len(tours)} tours / {len(makers)} makers / {len(pins)} link pins")
          PY

      # gh-pages — the publish target. Full branch so the commit preserves
      # audio/, images/, privacy/, etc. (we only stage Tours.json).
      # ⚠️ DO NOT go back to `actions/checkout` + `git push` here.
      #
      # gh-pages carries every audio file and image in the catalog — 6,565
      # files. Checking it out took 4m37s, and the push then died with
      #     error: RPC failed; HTTP 500
      #     send-pack: unexpected disconnect while reading sideband packet
      # every time, silently leaving the mirror stale while the Supabase seed
      # (the app's PRIMARY source) succeeded — so nothing looked broken until
      # someone opened a share link, which reads this file.
      #
      # The Contents API updates one file without cloning anything, so the
      # size of the branch stops mattering. Tours.json is ~7 MB, comfortably
      # under the API's 100 MB limit but over the 1 MB limit of the *read*
      # endpoint — hence fetching the existing blob SHA via the Git refs/trees
      # API rather than `GET /contents`.
      - name: Publish Tours.json to gh-pages via the Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC="main/TRAVEL GUIDED TOUR/Resources/Tours.json"

          # The blob SHA git would compute for the new content, and the one
          # gh-pages currently holds. Equal means there is nothing to publish.
          NEW_SHA=$(git hash-object "$SRC")
          # Root tree listing, not GET /contents: the contents endpoint refuses
          # to return a blob over 1 MB and this catalog is ~7 MB. The root tree
          # is a dozen entries whatever the branch weighs.
          OLD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/gh-pages" \
                      --jq '.tree[] | select(.path=="Tours.json") | .sha' 2>/dev/null || echo "")

          if [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "gh-pages Tours.json already matches main — nothing to publish."
            exit 0
          fi

          # Built with python, NOT `jq --arg`: the base64 of a 7 MB catalog is
          # ~10 MB, and a single argv entry that size blows past ARG_MAX.
          OLD_SHA="$OLD_SHA" python3 - "$SRC" > /tmp/payload.json <<'PYEOF'
          import base64, json, os, sys
          src = sys.argv[1]
          payload = {
              "message": "chore(catalog): publish Tours.json to gh-pages [skip ci]",
              "content": base64.b64encode(open(src, "rb").read()).decode(),
              "branch": "gh-pages",
          }
          old = os.environ.get("OLD_SHA", "")
          if old:                      # omitted entirely when creating the file
              payload["sha"] = old
          json.dump(payload, sys.stdout)
          PYEOF

          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/Tours.json" \
            --input /tmp/payload.json --jq .commit.sha

          echo "Published Tours.json to gh-pages."

      # Ask GitHub what it is actually serving, rather than trusting the step
      # exiting 0 — the whole reason
      # this job was rewritten is that a green-looking pipeline left a stale
      # mirror for sixteen hours.
      - name: Verify gh-pages now serves the same catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_SHA=$(git hash-object "main/TRAVEL GUIDED TOUR/Resources/Tours.json")
          LIVE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/gh-pages" \
                       --jq '.tree[] | select(.path=="Tours.json") | .sha')
          if [ "$NEW_SHA" != "$LIVE_SHA" ]; then
            echo "::error::gh-pages Tours.json is $LIVE_SHA but main is $NEW_SHA — the mirror did not update."
            exit 1
          fi
          echo "gh-pages mirror matches main ($LIVE_SHA)."

  # Upsert the same catalog into the live Supabase DB (the app's PRIMARY source
  # since PR #255). Independent of the gh-pages job above — runs in parallel and
  # a failure here never blocks the mirror. Opt-in: skips entirely unless the
  # SUPABASE_DB_URL secret is set. Serialized so two quick merges can't race.
  seed-supabase:
    name: Seed catalog into Supabase
    runs-on: ubuntu-latest
    # Same reasoning as `publish` above — ordered after the rebuild, never
    # blocked by it. Supabase is the app's PRIMARY source, so this job failing
    # to run is worse than it running against yesterday's suggestions.
    needs: rebuild-related
    if: ${{ !cancelled() }}
    concurrency:
      group: seed-supabase
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      # Secrets can't be referenced in step `if:` conditions, so read it into an
      # output here and gate the remaining steps on that.
      - name: Check for Supabase credential
        id: guard
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL not set — skipping Supabase seed (gh-pages mirror still published)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The seed script validates enums/FKs and exits non-zero on bad data,
      # so a malformed catalog fails the job before any DB write.
      - name: Generate seed SQL
        if: steps.guard.outputs.configured == 'true'
        run: python3 backend/seed_from_toursjson.py -o backend/seed.sql

      - name: Ensure psql is available
        if: steps.guard.outputs.configured == 'true'
        run: |
          psql --version || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

      # ON_ERROR_STOP=1 + the seed's begin/commit means any failed statement
      # aborts the transaction and fails the job — never a partial apply.
      - name: Apply seed to Supabase
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f backend/seed.sql
          echo "Catalog upserted into Supabase."
